<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mopai code2img smoke test</title>
</head>
<body>
<div id="results" style="font-family:monospace;font-size:12px;white-space:pre-wrap"></div>
<hr>
<script src="../lib/highlight.min.js"></script>
<script src="../lib/markdown-it.min.js"></script>
<script src="../lib/markdown-it-footnote.min.js"></script>
<script src="../src/state.js"></script>
<script src="../src/themes.js"></script>
<script src="../src/code2img.js"></script>
<script src="../src/mermaid.js"></script>
<script src="../src/math.js"></script>
<script src="../src/engine.js"></script>
<script>
window.__tests = [];
window.__done = false;
var PRI = '#3a7bd5';   // 测试统一用的主题色

function log(name, ok, extra) {
  window.__tests.push({ name: name, ok: !!ok, extra: extra || '' });
  var el = document.getElementById('results');
  el.textContent += (ok ? 'PASS ' : 'FAIL ') + name + '  ' + (extra || '') + '\n';
}

// ---------- 像素级辅助 ----------
// 只断言「dataURI 非空」是不够的：文字若被画成卡片底色，图仍然非空却是空白卡片。
// 这里把区域内出现最多的量化颜色当底色，其余像素算「墨迹」。
function _loadImg(uri) {
  return new Promise(function (res, rej) {
    var im = new Image();
    im.onload = function () { res(im); };
    im.onerror = function () { rej(new Error('image load failed')); };
    im.src = uri;
  });
}

function _inkStats(im, x0, y0, x1, y1) {
  var cv = document.createElement('canvas');
  cv.width = im.naturalWidth;
  cv.height = im.naturalHeight;
  var c = cv.getContext('2d');
  c.drawImage(im, 0, 0);
  var d = c.getImageData(x0, y0, x1 - x0, y1 - y0).data;
  var hist = {}, i, k, n = 0, minx = 1e9, maxx = -1, W = x1 - x0;
  for (i = 0; i < d.length; i += 4) {
    k = (d[i] >> 3) + ',' + (d[i + 1] >> 3) + ',' + (d[i + 2] >> 3);
    hist[k] = (hist[k] || 0) + 1;
  }
  var mode = null, mx = 0;
  for (k in hist) if (hist[k] > mx) { mx = hist[k]; mode = k; }
  for (i = 0; i < d.length; i += 4) {
    k = (d[i] >> 3) + ',' + (d[i + 1] >> 3) + ',' + (d[i + 2] >> 3);
    if (k === mode) continue;
    n++;
    var p = i / 4, px = p % W;
    if (px < minx) minx = px;
    if (px > maxx) maxx = px;
  }
  return { ink: n, w: maxx - minx + 1 };
}

// 与 code2img 的 LABEL_FONT / FONT_SIZE 保持一致
function _labelWidth(text) {
  var c = document.createElement('canvas').getContext('2d');
  c.font = '600 15px "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif';
  return c.measureText(text).width;
}

// 统计「节点框填充色」像素数：填充 = 主题色 14% 叠在卡片底色上（canvas source-over）
// 树状图这类只有线条的图必须为 0；一旦框识别误判，就会画出一摞药丸方块
function _tintCount(im, primaryHex, bgHex, x0, y0, x1, y1) {
  var cv = document.createElement('canvas');
  cv.width = im.naturalWidth;
  cv.height = im.naturalHeight;
  var c = cv.getContext('2d');
  c.drawImage(im, 0, 0);
  var d = c.getImageData(x0, y0, x1 - x0, y1 - y0).data;
  function rgb(hex) {
    return [parseInt(hex.substr(1, 2), 16), parseInt(hex.substr(3, 2), 16), parseInt(hex.substr(5, 2), 16)];
  }
  var pr = rgb(primaryHex), bg = rgb(bgHex);
  var tint = [0, 1, 2].map(function (j) { return pr[j] * 0.14 + bg[j] * 0.86; });
  var n = 0;
  for (var i = 0; i < d.length; i += 4) {
    if (Math.abs(d[i] - tint[0]) < 7 && Math.abs(d[i + 1] - tint[1]) < 7 && Math.abs(d[i + 2] - tint[2]) < 7) n++;
  }
  return n;
}

window.runTests = function () {
  // 用「格数对齐」生成器构造样本（CJK=2 格），保证样本自身无空格误差，
  // 渲染后逐行右边框必须重合（否则算渲染器回归）
  var W = 38;
  function cells(s) {
    var t = 0;
    Array.from(s).forEach(function (ch) {
      var cp = ch.codePointAt(0);
      var w = (cp >= 0x1100 && cp <= 0x115F) || (cp >= 0x2E80 && cp <= 0x303E) ||
        (cp >= 0x3040 && cp <= 0x33FF) || (cp >= 0x3400 && cp <= 0x4DBF) ||
        (cp >= 0x4E00 && cp <= 0x9FFF) || (cp >= 0xA000 && cp <= 0xA4CF) ||
        (cp >= 0xAC00 && cp <= 0xD7A3) || (cp >= 0xF900 && cp <= 0xFAFF) ||
        (cp >= 0xFE10 && cp <= 0xFE19) || (cp >= 0xFE30 && cp <= 0xFE6F) ||
        (cp >= 0xFF00 && cp <= 0xFF60) || (cp >= 0xFFE0 && cp <= 0xFFE6) ||
        (cp >= 0x1F000 && cp <= 0x1FAFF) || (cp >= 0x20000 && cp <= 0x2FFFD) ||
        (cp >= 0x30000 && cp <= 0x3FFFD);
      t += w ? 2 : 1;
    });
    return t;
  }
  function row(content) {
    var c = cells(content);
    var l = Math.floor((W - c) / 2);
    var r = W - c - l;
    return '\u2502' + ' '.repeat(l) + content + ' '.repeat(r) + '\u2502';
  }
  var ascii = [
    '\u250c' + '\u2500'.repeat(W) + '\u2510',
    row('人生/教育目标层'),
    '\u2514' + '\u2500'.repeat(19) + '\u252c' + '\u2500'.repeat(18) + '\u2518',
    ' '.repeat(20) + '\u2193',
    '\u250c' + '\u2500'.repeat(W) + '\u2510',
    row('Learner Model'),
    row('学生数字孪生'),
    '\u2514' + '\u2500'.repeat(W) + '\u2518'
  ].join('\n');

  // 1. 直接渲染 ASCII 图（含 CJK + 框线 + 箭头）
  var uri = MopaiCode2Img.renderBlock(ascii, {
    lang: '', title: '架构图', codeThemeId: 'debug-console', primary: '#3a7bd5'
  });
  log('renderBlock ascii', uri && uri.indexOf('data:image/png') === 0, 'len=' + (uri ? uri.length : 'null'));
  if (uri) {
    var im = document.createElement('img');
    im.src = uri;
    im.style.width = '420px';
    im.style.display = 'block';
    document.body.appendChild(im);
  }

  // 2. 引擎管线：```img 强制转图
  var theme = MopaiThemes.getTheme('山吹');
  var html = MopaiEngine.render('```img 架构图\n' + ascii + '\n```', theme, { codeAsImage: false });
  log('engine img fence', html.indexOf('data-codeimg') > -1 && html.indexOf('data:image/png') > -1, '');

  // 3. 引擎管线：全局 codeAsImage 时普通代码块转图 + hljs 配色
  var html2 = MopaiEngine.render('```python\nprint("hi")\n```', theme, { codeAsImage: true });
  log('engine global', html2.indexOf('data:image/png') > -1, '');

  // 4. 未开启全局、无标记的普通代码块保持文本
  var html3 = MopaiEngine.render('```js\nlet a = 1;\n```', theme, { codeAsImage: false });
  log('plain code stays', html3.indexOf('<pre') > -1 && html3.indexOf('data:image/png') === -1, '');

  // 5. 几何重绘（L1）：自动识别线框图 → 与「强制等宽」渲染结果不同
  var autoUri = MopaiCode2Img.renderBlock(ascii, {
    lang: '', title: '几何重绘', codeThemeId: 'debug-console', primary: '#3a7bd5'
  });
  var monoUri = MopaiCode2Img.renderBlock(ascii, {
    lang: '', title: '等宽字符', codeThemeId: 'debug-console', primary: '#3a7bd5', forceText: true
  });
  log('diagram redraw differs', !!autoUri && !!monoUri && autoUri !== monoUri,
    'auto=' + (autoUri ? autoUri.length : 0) + ' mono=' + (monoUri ? monoUri.length : 0));
  if (autoUri) {
    var imD = document.createElement('img');
    imD.src = autoUri; imD.style.width = '520px'; imD.style.display = 'block';
    document.body.appendChild(imD);
  }
  // 普通代码不得被误判为图例
  var codeOnly = MopaiCode2Img.renderBlock('def f(x):\n    return x + 1', {
    lang: 'python', title: '非图例', codeThemeId: 'debug-console', primary: '#3a7bd5'
  });
  var codeMono = MopaiCode2Img.renderBlock('def f(x):\n    return x + 1', {
    lang: 'python', title: '非图例', codeThemeId: 'debug-console', primary: '#3a7bd5', forceText: true
  });
  log('code not misdetected', codeOnly === codeMono, '');

  // 6. Mermaid 异步渲染（懒加载 lib/mermaid.min.js）
  var holder = document.createElement('div');
  document.body.appendChild(holder);
  var html4 = MopaiEngine.render('```mermaid\nflowchart LR\n  A[开始] --> B{判断}\n  B -->|是| C[结束]\n  B -->|否| A\n```', theme, {});
  holder.innerHTML = html4;

  // 7. 公式转图（懒加载 lib/mathjax-tex-svg.js）
  var mathHolder = document.createElement('div');
  document.body.appendChild(mathHolder);
  var mathHtml = MopaiEngine.render(
    '行内 $a \\ne 0$ 与块级：\n\n$$\n\\int_0^1 x^2\\,dx = \\frac13\n$$\n\n价格 $199 不应误判。',
    theme, {});
  mathHolder.innerHTML = mathHtml;
  var placeholders = mathHolder.querySelectorAll('[data-math]').length;

  MopaiMermaid.renderAllIn(holder, { primary: '#3a7bd5' }).then(function () {
    var img = holder.querySelector('img[data-mermaid-img]');
    log('mermaid render', !!img && (img.getAttribute('src') || '').indexOf('data:image/png') === 0,
      img ? 'len=' + img.getAttribute('src').length : 'no img');
    if (img && img.getAttribute('src').length > 0) {
      var im2 = document.createElement('img');
      im2.src = img.getAttribute('src');
      im2.style.width = '420px';
      im2.style.display = 'block';
      document.body.appendChild(im2);
    }
    return MopaiMath.renderAllIn(mathHolder, { color: '#333333', fontPx: 16 });
  }).then(function () {
    var inline = mathHolder.querySelectorAll('img[data-math-img="inline"]').length;
    var display = mathHolder.querySelectorAll('img[data-math-img="display"]').length;
    var left = mathHolder.querySelectorAll('[data-math]').length;
    var errs = mathHolder.querySelectorAll('[data-math-error]').length;
    log('math render', placeholders === 2 && inline === 1 && display === 1 && left === 0 && errs === 0,
      'placeholders=' + placeholders + ' inline=' + inline + ' display=' + display + ' left=' + left + ' err=' + errs);
    var priceKept = mathHolder.textContent.indexOf('$199') > -1;
    log('math price guard', priceKept, '');
    var mimg = mathHolder.querySelector('img[data-math-img="display"]');
    if (mimg) {
      var im3 = document.createElement('img');
      im3.src = mimg.getAttribute('src');
      im3.style.width = '300px';
      im3.style.display = 'block';
      document.body.appendChild(im3);
    }
    // ---- 10~16：像素级回归（空白卡片 / 误判 / 错位线框 / 弱箭头吞字母）----
    return _pixelChecks();
  }).then(function () {
    // ---- 17~22：呈现方式与图片配额（抖音文章图片上限 30 张）----
    return _renderChecks(theme);
  }).then(function () {
    window.__done = true;
  }).catch(function (e) {
    log('mermaid/math render', false, e.message);
    window.__done = true;
  });
};

/**
 * 像素级回归：跑完前面 9 项后执行
 * 10 纯英文单行文本卡必须有字（历史 bug：fillStyle 未初始化 → 文字画成卡片底色）
 * 11 中文 + ↓ 流程卡必须有字
 * 12 竖向流程链（标签/箭头行交替）重绘成设计稿风节点框（与线框图同款）
 * 13 普通多行文本（无箭头）不得被误画成流程图
 * 14 错位线框（按字数补空格）== 对齐版本（框识别容差 + 框边竖刺抑制）
 * 15 树状图里不得出现节点框（框识别误判会把 ├── 树枝变成一摞圆角药丸）
 * 16 框内标签里的 v 不得被当成箭头吞掉（标签墨迹宽度 ≈ 文本宽度）
 */
function _pixelChecks() {
  var opts = { lang: 'text', codeThemeId: 'debug-console', primary: PRI, watermark: false };
  var mon = function (code) {
    return MopaiCode2Img.renderBlock(code, { lang: 'text', codeThemeId: 'debug-console', primary: PRI, watermark: false, forceText: true });
  };
  var en10 = 'Student Cognitive Model';
  var flow = '前一晚睡眠不足\n       \u2193\n注意力下降\n       \u2193\n工作记忆负荷升高\n       \u2193\n简单计算错误';
  var list = '姓名\n成绩\n排名\n错题\n出勤';
  var codeish = 'S_{t+1}=f(S_t,I_t,E_t)\nE = mc^2';
  var tree = [
    '学生 A', '',
    '知识状态',
    '\u251c\u2500\u2500 \u6570\u5b66',
    '\u2502   \u251c\u2500\u2500 \u4ee3\u6570      87%',
    '\u2502   \u251c\u2500\u2500 \u51e0\u4f55      62%',
    '\u2502   \u251c\u2500\u2500 \u51fd\u6570      41%',
    '\u2502   \u2514\u2500\u2500 \u6982\u7387      73%',
    '\u2502',
    '\u251c\u2500\u2500 \u7269\u7406',
    '\u2502   \u251c\u2500\u2500 \u529b\u5b66      81%',
    '\u2502   \u2514\u2500\u2500 \u7535\u5b66      55%'
  ].join('\n');
  var enUri = MopaiCode2Img.renderBlock(en10, opts);
  var flowUri = MopaiCode2Img.renderBlock(flow, opts);
  var flowMono = mon(flow);
  var listUri = MopaiCode2Img.renderBlock(list, opts);
  var listMono = mon(list);
  var codeUri = MopaiCode2Img.renderBlock(codeish, opts);
  var codeMono = mon(codeish);
  var treeUri = MopaiCode2Img.renderBlock(tree, opts);

  // 错位样本：内容行比框线多 1 格（尾随 │ 落在框外），对齐样本补 1 个尾随空格 → 两者总格数相同
  var top = '\u250c' + '\u2500'.repeat(21) + '\u2510';
  var bot = '\u2514' + '\u2500'.repeat(21) + '\u2518';
  var label = '\u4eba\u751f/\u6559\u80b2\u76ee\u6807\u5c42';
  var mis = [top, '\u2502   ' + label + '    \u2502', bot].join('\n');
  var ali = [top, '\u2502   ' + label + '   \u2502 ', bot].join('\n');
  var misUri = MopaiCode2Img.renderBlock(mis, opts);
  var aliUri = MopaiCode2Img.renderBlock(ali, opts);

  // 弱箭头误判样本：标签里含 v（上方正好压着框线）
  var txt = 'Intervention Engine';
  var boxUri = MopaiCode2Img.renderBlock([top, '\u2502 ' + txt + ' \u2502', bot].join('\n'), opts);

  var shown = 0;
  function show(uri, w) {
    if (!uri || shown > 2) return;
    shown++;
    var im = document.createElement('img');
    im.src = uri;
    im.style.width = (w || 420) + 'px';
    im.style.display = 'block';
    document.body.appendChild(im);
  }

  return _loadImg(enUri).then(function (im) {
    var st = _inkStats(im, 20, 30, im.naturalWidth - 60, im.naturalHeight - 20);
    log('ink: en one-liner', st.ink > 150, 'ink=' + st.ink);
    return _loadImg(flowUri);
  }).then(function (im) {
    var st = _inkStats(im, 20, 30, im.naturalWidth - 60, im.naturalHeight - 20);
    log('ink: cjk flow', st.ink > 300, 'ink=' + st.ink);
    log('cjk flow \u2192 chain', flowUri !== flowMono, '');
    log('plain list \u2192 list card', listUri !== listMono, '');
    log('single label \u2192 chip', enUri !== MopaiCode2Img.renderBlock(en10, { lang: 'text', codeThemeId: 'debug-console', primary: PRI, watermark: false, forceText: true }), '');
    log('code-ish text stays mono', codeUri === codeMono, '');
    show(flowUri, 220);
    log('misaligned box redraw', !!misUri && misUri === aliUri, 'len=' + (misUri ? misUri.length : 0));
    return _loadImg(misUri);
  }).then(function (im) {
    // 对照：这个样本有一个真节点框，必须有大量"节点填充色"像素，否则下面的断言是空转
    var codeColors = (typeof MopaiThemes !== 'undefined' && MopaiThemes.getCodeThemeColors)
      ? MopaiThemes.getCodeThemeColors('debug-console') : null;
    var bgHex = (codeColors && codeColors.bg) || '#0F172A';
    var boxTint = _tintCount(im, PRI, bgHex, 16, 16, im.naturalWidth - 48, im.naturalHeight - 28);
    return _loadImg(treeUri).then(function (tim) {
      var treeTint = _tintCount(tim, PRI, bgHex, 16, 16, tim.naturalWidth - 48, tim.naturalHeight - 28);
      log('tree has no boxes', boxTint > 2000 && treeTint < 500, 'treeTint=' + treeTint + ' boxTint=' + boxTint);
      show(treeUri, 260);
      return _loadImg(boxUri);
    });
  }).then(function (im) {
    // 标签行中心 y = (PAD_T + 1*LINE_H + LINE_H/2) * SCALE = (16 + 22 + 11) * 2 = 98
    // 采样带左右各留出 PAD+6，避开卡片主题色条与框线本身（否则边界会被算进墨迹）
    var band = _inkStats(im, 46, 84, im.naturalWidth - 46, 112);
    var expect = 2 * _labelWidth(txt);
    log('label keeps letters (v)', band.w > expect * 0.88 && band.w < expect * 1.12,
      'bbox=' + band.w + ' expect=' + Math.round(expect));
    show(boxUri, 320);
  });
}

/**
 * 呈现方式与图片配额断言（抖音文章图片上限 30 张，纯文本不该占配额）
 * 17 纯文本块不转图（排版成段落），但 ```img 围栏仍然强制转图
 * 18 代码块仍然转图（等宽/缩进/hljs 高亮必须保真）
 * 19 展示公式必须带 CSS 宽度（PNG 是 3x 像素，不给宽度浏览器按 3 倍显示再被 max-width 压小）
 * 20 超宽展示公式自动折行（宽度降到栏宽内、变成多行）
 * 21 短公式不受折行影响
 */
function _renderChecks(theme) {
  var WIDE = '\\text{Human Development}\n=\nKnowledge\n+\nCapability\n+\nAgency\n+\nMotivation\n+\nHealth\n+\nCreativity\n+\nSocialization\n+\nValues';
  var txt = 'AI 替学生学习';
  var htmlText = MopaiEngine.render('```text\n' + txt + '\n```', theme, { codeAsImage: true });
  var htmlForce = MopaiEngine.render('```img\n' + txt + '\n```', theme, { codeAsImage: true });
  var htmlCode = MopaiEngine.render('```python\nprint("hi")\n```', theme, { codeAsImage: true });
  log('plain text: no image', htmlText.indexOf('<img') === -1 && htmlText.indexOf(txt) > -1, '');
  log('```img forces image', htmlForce.indexOf('data:image/png') > -1, '');
  log('code still becomes image', htmlCode.indexOf('data:image/png') > -1, '');

  var holder = document.createElement('div');
  document.body.appendChild(holder);
  holder.innerHTML = MopaiEngine.render('$$\nE = mc^2\n$$', theme, {});
  return MopaiMath.renderAllIn(holder, { color: '#333333', fontPx: 16 }).then(function () {
    var img = holder.querySelector('img[data-math-img="display"]');
    var style = img ? (img.getAttribute('style') || '') : '';
    log('display formula has css width', /width:\s*\d+px/.test(style), style.slice(0, 58));
    return MopaiMath.toPng(WIDE, { display: true, color: '#333333', fontPx: 16 });
  }).then(function (r) {
    log('wide formula wraps', r.width <= 640 && r.height > 30,
      'w=' + Math.round(r.width) + ' h=' + Math.round(r.height));
    return MopaiMath.toPng('E = mc^2', { display: true, color: '#333333', fontPx: 16 });
  }).then(function (r) {
    log('short formula untouched', r.width < 120 && r.height < 30,
      'w=' + Math.round(r.width) + ' h=' + Math.round(r.height));
    // 尺寸下限：抖音/头条要求图片 ≥100×100（小公式会被自动提高倍率）
    var tinyCard = MopaiCode2Img.renderBlock('A', { lang: 'text', codeThemeId: 'debug-console', primary: PRI, watermark: false });
    var mhost = document.createElement('div');
    document.body.appendChild(mhost);
    mhost.innerHTML = MopaiEngine.render('```mermaid\nflowchart LR\n  A-->B\n```', theme, {});
    return MopaiMermaid.renderAllIn(mhost, {}).then(function () {
      var mimg = mhost.querySelector('img[data-mermaid-img]');
      return Promise.all([
        _loadImg(tinyCard),
        mimg ? _loadImg(mimg.getAttribute('src')) : null,
        MopaiMath.toPng('\\frac{2}{5}', { display: true, color: '#333333', fontPx: 16 }).then(function (r2) { return _loadImg(r2.uri); }),
        MopaiMath.toPng('x', { display: false, color: '#333333', fontPx: 16 }).then(function (r3) { return _loadImg(r3.uri); })
      ]);
    }).then(function (ims) {
      var list = ims.filter(Boolean);
      var ok = list.length === 4 && list.every(function (im) { return im.naturalWidth >= 100 && im.naturalHeight >= 100; });
      log('all images \u2265 100\u00d7100', ok, list.map(function (im) { return im.naturalWidth + 'x' + im.naturalHeight; }).join(' '));
    });
  });
}
</script>
</body>
</html>
